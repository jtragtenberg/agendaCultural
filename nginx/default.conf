server {
    listen 80;
    server_name agenda.rec.br www.agenda.rec.br;

    # Desafio ACME para renovação do certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name agenda.rec.br www.agenda.rec.br;

    ssl_certificate /etc/letsencrypt/live/agenda.rec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenda.rec.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Rotas da API
    location ~ ^/(autenticacao|eventos|artistas|locais|agenda|seguir|seguindo|usuarios|instagram|admin|ia|saude) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
